
#Grafana - reto ACME (HTTP) + redirect a HTTPS
server {
  listen 80;
  server_name grafana.zuard.net;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }

  access_log off;
  error_log  /var/log/nginx/error.log error;
}

#Grafana
server {
  listen 443 ssl;
  server_name grafana.zuard.net;

  ssl_certificate /etc/letsencrypt/live/grafana.zuard.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grafana.zuard.net/privkey.pem;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass http://grafana:3000;
  }

  access_log off;
  error_log  /var/log/nginx/error.log error;
}