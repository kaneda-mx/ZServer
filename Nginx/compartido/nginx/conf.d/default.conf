server {
  listen 443 ssl;
  server_name vscode.zuard.net;
  ssl_certificate /etc/ssl/certs/vscode.crt;
  ssl_certificate_key /etc/ssl/private/vscode.key;

  location / {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass http://vscode:8443;
        # Necesario para terminales, extensiones y comunicación persistente.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    #proxy_buffering off;

  }
}

