version: '3.8'

services:
  nginx-proxy:
    image: nginx-otel:latest
    container_name: nginx-otel
    ports:
      - "443:443"
      - "3000:3000"
      - "80:80"
    volumes:
      - /compartido/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - /compartido/nginx/includes/proxy.conf:/etc/nginx/includes/proxy.conf
      - /compartido/nginx/certificados/zuard/certs:/etc/ssl/certs/
      - /compartido/nginx/certificados/zuard/certs:/etc/ssl/private/
      - /compartido/nginx/certificados:/certificados/
      - /compartido/nginx/letsencrypt:/etc/letsencrypt:ro
      - /compartido/nginx/certbot-webroot:/var/www/certbot:ro
    networks:
      - victoriametrics_vm_net2
      - wordpress_rossy_default
    restart: always

  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: nginx-certbot
    volumes:
      - /compartido/nginx/letsencrypt:/etc/letsencrypt
      - /compartido/nginx/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
      - /compartido/nginx/cloudflare-draquimbert.ini:/etc/letsencrypt/cloudflare-draquimbert.ini:ro
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done"
    restart: always

networks:
  victoriametrics_vm_net2:
    external: true
  wordpress_rossy_default:
    external: true


